<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM | Сервисный центр</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Уведомления -->
  <div id="toast" class="toast">Уведомление</div>

  <header class="topbar">
    <div class="logo">⚙️ ServiceCenter CRM</div>
    <div class="actions">
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">⬆️ Загрузить базу</button>
      <button class="btn btn-outline" onclick="downloadData()">⬇️ Скачать базу</button>
    </div>
  </header>

  <main class="container">
    
    <!-- Статистика -->
    <section class="stats">
      <div class="stat-card">
        <h3>Всего заявок</h3>
        <p id="stat-total">0</p>
      </div>
      <div class="stat-card new">
        <h3>Новые</h3>
        <p id="stat-new">0</p>
      </div>
      <div class="stat-card work">
        <h3>В работе</h3>
        <p id="stat-work">0</p>
      </div>
      <div class="stat-card done">
        <h3>Выполнено</h3>
        <p id="stat-done">0</p>
      </div>
    </section>

    <div class="layout">
      <!-- Форма добавления -->
      <section class="panel">
        <h2>Создать заявку</h2>
        <form id="request-form" onsubmit="addRequest(event)">
          <div class="input-group">
            <label>Клиент</label>
            <input type="text" id="client" placeholder="Иванов Иван" required>
          </div>
          <div class="input-group">
            <label>Телефон</label>
            <input type="text" id="phone" placeholder="+7 (999) 000-00-00">
          </div>
          <div class="input-group">
            <label>Описание неисправности</label>
            <textarea id="desc" rows="3" placeholder="Не включается..." required></textarea>
          </div>
          <div class="input-group">
            <label>Услуга</label>
            <select id="service">
              <option value="Диагностика">Диагностика</option>
              <option value="Ремонт">Ремонт</option>
              <option value="Чистка">Чистка от пыли</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Добавить заявку</button>
        </form>
      </section>

      <!-- Список заявок -->
      <section class="panel">
        <div class="panel-header">
          <h2>Список заявок</h2>
          <input type="text" id="search" placeholder="🔍 Поиск..." oninput="render()">
        </div>
        
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>№</th>
                <th>Клиент</th>
                <th>Проблема</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="requests"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- Модальное окно редактирования -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h2>Редактировать заявку</h2>
      <input type="hidden" id="edit-id">
      <div class="input-group">
        <label>Клиент</label>
        <input type="text" id="edit-client">
      </div>
      <div class="input-group">
        <label>Описание</label>
        <textarea id="edit-desc" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
